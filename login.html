<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — VORTEX</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <nav class="nav scrolled">
    <a href="index.html" class="nav__logo">VORTEX<span>.</span></a>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p>Login to access your dashboard</p>
      <div id="loginStatus" class="form-status" style="margin-bottom:1rem;"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn--primary btn--full" style="margin-top:0.5rem;">
          Login
        </button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('loginStatus');
      const btn = e.target.querySelector('button');
      btn.textContent = 'Logging in...'; btn.disabled = true;
      const formData = new FormData(e.target);
      try {
        const res = await fetch('php/login.php', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          status.className = 'form-status success';
          status.textContent = 'Login successful! Redirecting...';
          setTimeout(() => window.location.href = 'admin/dashboard.php', 1000);
        } else {
          status.className = 'form-status error';
          status.textContent = data.message;
          btn.textContent = 'Login'; btn.disabled = false;
        }
      } catch {
        status.className = 'form-status error';
        status.textContent = 'Server error. Try again.';
        btn.textContent = 'Login'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
