<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — VORTEX</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <nav class="nav scrolled">
    <a href="index.html" class="nav__logo">VORTEX<span>.</span></a>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p>Join the VORTEX team portal</p>
      <div id="regStatus" class="form-status" style="margin-bottom:1rem;"></div>
      <form id="regForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" placeholder="Your Name" required/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Min. 8 characters" required minlength="8"/>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="confirm_password" placeholder="Repeat password" required/>
        </div>
        <button type="submit" class="btn btn--primary btn--full" style="margin-top:0.5rem;">
          Create Account
        </button>
      </form>
      <div class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('regStatus');
      const btn = e.target.querySelector('button');
      const fd = new FormData(e.target);
      if (fd.get('password') !== fd.get('confirm_password')) {
        status.className = 'form-status error';
        status.textContent = 'Passwords do not match.';
        return;
      }
      btn.textContent = 'Creating...'; btn.disabled = true;
      try {
        const res = await fetch('php/register.php', { method: 'POST', body: fd });
        const data = await res.json();
        status.className = 'form-status ' + (data.success ? 'success' : 'error');
        status.textContent = data.message;
        if (data.success) setTimeout(() => window.location.href = 'login.html', 1500);
      } catch {
        status.className = 'form-status error';
        status.textContent = 'Server error. Try again.';
      }
      btn.textContent = 'Create Account'; btn.disabled = false;
    });
  </script>
</body>
</html>
